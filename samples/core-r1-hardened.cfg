! Lab config — hardened baseline
version 15.6
service timestamps log datetime msec localtime show-timezone
service password-encryption
hostname CORE-R1
!
security passwords min-length 12
enable algorithm-type scrypt secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username netadmin privilege 15 algorithm-type scrypt secret 9 $9$2MJBozw/9R3UsU$zXsIPq8n0a7tq3W1A1Hh8Vz7vKk5O4hCw0l2bQyQ0rI
!
no ip http server
no ip http secure-server
no ip source-route
no cdp run
ip ssh version 2
login block-for 120 attempts 5 within 60
login on-failure log
!
ip access-list standard MGMT-ONLY
 permit 10.0.99.0 0.0.0.255
 deny any log
!
snmp-server group SECURE v3 priv
!
logging host 10.0.99.10
logging trap informational
ntp server 10.0.99.1
!
interface GigabitEthernet0/0
 description WAN
 ip address 203.0.113.2 255.255.255.252
!
banner login ^C Authorized access only. All activity is monitored. ^C
!
line con 0
 exec-timeout 5 0
line vty 0 4
 access-class MGMT-ONLY in
 exec-timeout 5 0
 transport input ssh
line vty 5 15
 access-class MGMT-ONLY in
 exec-timeout 5 0
 transport input ssh
!
end
